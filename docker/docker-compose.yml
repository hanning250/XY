# ISUP 告警平台 —— 本机 Docker 编排
#
# 用法：
#   cd /home/sy304/isup-alarm
#   docker compose -f docker/docker-compose.yml --env-file docker/deploy.env up -d --build
#
# ★ 必须 network_mode: host —— 设备回连 7661/7662/7663/6011/7665/8000，
#   端口映射会导致 SDK 通告错误 IP。

services:
  isup-alarm:
    build:
      context: ..
      dockerfile: Dockerfile
    image: isup-alarm:local
    container_name: isup-alarm
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./deploy.env
    volumes:
      - ../runtime/data:/app/data
      - ../runtime/storage:/app/storage
      - ../runtime/media:/app/media
      - ../runtime/logs:/app/IsupSDKLog
      - ../runtime/outputFiles:/app/outputFiles
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
