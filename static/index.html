<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>告警监控</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --panel: #111827;
      --border: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #38bdf8;
      --ok: #22c55e;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header, main { padding: 16px 20px; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    h1 { margin: 0; font-size: 20px; }
    .status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 8px;
      background: var(--warn);
    }
    .status-dot.ok { background: var(--ok); }
    #sseStatus { color: var(--muted); font-size: 13px; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      border-bottom: 1px solid var(--border);
      padding: 12px 10px;
      text-align: left;
      vertical-align: middle;
    }
    th { color: var(--muted); font-weight: 600; white-space: nowrap; }
    .empty { text-align: center; color: var(--muted); padding: 32px; }
    .thumb {
      display: block;
      width: 160px;
      max-width: 100%;
      height: auto;
      max-height: 120px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .no-pic { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>告警监控</h1>
    <div><span id="sseDot" class="status-dot"></span><span id="sseStatus">连接中...</span></div>
  </header>

  <main>
    <table>
      <thead>
        <tr>
          <th>告警时间</th>
          <th>告警类型</th>
          <th>告警图片</th>
        </tr>
      </thead>
      <tbody id="alarmBody">
        <tr><td colspan="3" class="empty">加载中...</td></tr>
      </tbody>
    </table>
  </main>

  <script>
    const alarmBody = document.getElementById("alarmBody");
    const sseDot = document.getElementById("sseDot");
    const sseStatus = document.getElementById("sseStatus");

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text ?? "";
      return div.innerHTML;
    }

    function formatTime(item) {
      const raw = item.event_time || item.created_at || "";
      if (!raw) return "-";
      const d = new Date(raw);
      return Number.isNaN(d.getTime()) ? raw : d.toLocaleString("zh-CN");
    }

    function renderPicture(urls) {
      const url = (urls || [])[0];
      if (!url) return '<span class="no-pic">无图片</span>';
      const safe = escapeHtml(url);
      return `<a href="${safe}" target="_blank" rel="noopener"><img class="thumb" src="${safe}" alt="告警图片" loading="lazy" /></a>`;
    }

    function renderRows(items) {
      if (!items.length) {
        alarmBody.innerHTML = '<tr><td colspan="3" class="empty">暂无告警</td></tr>';
        return;
      }
      alarmBody.innerHTML = items.map((item) => `<tr>
        <td>${escapeHtml(formatTime(item))}</td>
        <td>${escapeHtml(item.event_type_label || item.event_type || "未知")}</td>
        <td>${renderPicture(item.picture_urls)}</td>
      </tr>`).join("");
    }

    async function loadAlarms() {
      try {
        const res = await fetch("/api/alarms");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        renderRows(await res.json());
      } catch (err) {
        alarmBody.innerHTML = `<tr><td colspan="3" class="empty">加载失败: ${escapeHtml(err.message)}</td></tr>`;
      }
    }

    function connectSse() {
      const source = new EventSource("/api/alarms/stream");
      source.onopen = () => {
        sseDot.classList.add("ok");
        sseStatus.textContent = "实时更新已连接";
      };
      source.onerror = () => {
        sseDot.classList.remove("ok");
        sseStatus.textContent = "连接断开，重试中...";
      };
      source.onmessage = (event) => {
        if (!event.data) return;
        try {
          const payload = JSON.parse(event.data);
          if (payload.type === "alarm") loadAlarms();
        } catch (_) {}
      };
    }

    loadAlarms();
    connectSse();
    setInterval(loadAlarms, 10000);
  </script>
</body>
</html>
